aid: reno
name: Reno
description: Reno (Reno Home) is a Dubai, UAE based one-stop home renovation platform
  that connects homeowners and businesses with professional interior designers and
  vetted contractors, managing renovation projects end-to-end from design and contracting
  through quality inspections and completion. Its Reno mobile app lets clients track
  project progress, budgets, timelines and change requests in real time, and it offers
  a "Renovate Now, Pay Later" financing model with 3, 6 or 12 month installment plans.
  Reno is backed by 500 Global (500 Sanabil), Hub71 and other regional investors. It
  is a consumer-facing service and publishes no public developer API.
